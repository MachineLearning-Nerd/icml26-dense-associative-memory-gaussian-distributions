[project]
name = "ddam-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2509.23162"
requires-python = "==3.12.*"
dependencies = [
  "matplotlib>=3.10,<3.11",
  "numpy>=2.2,<2.3",
  "scipy>=1.15,<1.16",
  "torch>=2.7,<2.8",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
